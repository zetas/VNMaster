name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Test, lint, type-check, and audit
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Synchronize locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run --frozen pytest -q

      - name: Run Ruff
        run: uv run --frozen ruff check src tests

      - name: Run strict mypy
        run: uv run --frozen mypy src

      - name: Run Bandit
        run: uv run --frozen bandit -q -r src

      - name: Build distributions
        run: uv build

      - name: Export locked dependency graph
        run: uv export --quiet --frozen --all-extras --no-emit-project --output-file requirements-audit.txt

      - name: Audit locked dependencies
        run: uv run --frozen pip-audit --require-hashes --disable-pip --requirement requirements-audit.txt

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
